name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Lint with ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check with mypy (if available)
      run: |
        if uv pip list | grep -q mypy; then
          uv run mypy .
        else
          echo "mypy not installed, skipping type check"
        fi
      continue-on-error: true

    - name: Test with pytest
      run: |
        uv run pytest -v

    - name: Start FastAPI server for API linting
      run: |
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5

    - name: Generate OpenAPI spec
      run: |
        curl -o openapi.json http://localhost:8000/openapi.json

    - name: Setup Node.js for Spectral
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Spectral
      run: npm install -g @stoplight/spectral-cli

    - name: Lint API with Spectral
      run: |
        spectral lint openapi.json --format stylish --verbose

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv sync

    - name: Build application
      run: |
        uv run python -c "import main; print('Application builds successfully')"

    - name: Test API endpoints
      run: |
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5

        # Test health endpoint
        curl -f http://localhost:8000/health

        # Test root endpoint
        curl -f http://localhost:8000/

        # Test OpenAPI docs are accessible
        curl -f http://localhost:8000/docs > /dev/null
        curl -f http://localhost:8000/redoc > /dev/null

        echo "All API endpoints are accessible"