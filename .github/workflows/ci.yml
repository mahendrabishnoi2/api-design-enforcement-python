name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Lint with ruff
      run: |
        echo "::group::Running ruff linting"
        uv run ruff check . --output-format=github
        echo "::endgroup::"
        echo "::group::Checking code formatting"
        uv run ruff format --check .
        echo "::endgroup::"

    - name: Type check with mypy (if available)
      run: |
        if uv pip list | grep -q mypy; then
          echo "::group::Running mypy type checking"
          uv run mypy .
          echo "::endgroup::"
        else
          echo "mypy not installed, skipping type check"
        fi
      continue-on-error: true

    - name: Test with pytest
      run: |
        echo "::group::Running pytest tests"
        uv run pytest -v --tb=short
        echo "::endgroup::"

    - name: Start FastAPI server for API linting
      run: |
        echo "::group::Starting FastAPI server"
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl --retry 5 --retry-delay 1 --retry-connrefused http://localhost:8000/health
        echo "::endgroup::"

    - name: Generate OpenAPI spec
      run: |
        echo "::group::Generating OpenAPI specification"
        curl -o openapi.json http://localhost:8000/openapi.json
        echo "OpenAPI spec generated successfully"
        echo "::endgroup::"

    - name: Lint API with Spectral
      uses: stoplightio/spectral-action@v0.8.11
      with:
        file_glob: 'openapi.json'
        spectral_ruleset: '.spectral.yml'
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        env: github

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event.pull_request.draft == false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        echo "::group::Installing dependencies"
        uv sync
        echo "::endgroup::"

    - name: Build application
      run: |
        echo "::group::Building application"
        uv run python -c "import main; print('✓ Application builds successfully')"
        echo "::endgroup::"

    - name: Test API endpoints
      run: |
        echo "::group::Starting API server for endpoint testing"
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl --retry 5 --retry-delay 1 --retry-connrefused http://localhost:8000/health
        echo "::endgroup::"

        echo "::group::Testing API endpoints"
        # Test health endpoint
        echo "Testing health endpoint..."
        curl -f http://localhost:8000/health

        # Test root endpoint
        echo "Testing root endpoint..."
        curl -f http://localhost:8000/

        # Test new categories endpoint
        echo "Testing categories endpoint..."
        curl -f http://localhost:8000/categories

        # Test OpenAPI docs are accessible
        echo "Testing documentation endpoints..."
        curl -f http://localhost:8000/docs > /dev/null
        curl -f http://localhost:8000/redoc > /dev/null

        echo "✓ All API endpoints are accessible"
        echo "::endgroup::"