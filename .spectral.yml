extends: ["spectral:oas"]

rules:
  # OpenAPI 3.1 specific rules
  openapi-tags-alphabetical: false
  operation-operationId-unique: true

  # Custom API design rules
  operation-description: true
  operation-tags: true

  # Schema rules
  schema-properties-descriptions:
    severity: warn
    description: "Schema properties should have descriptions"
    given: "$.components.schemas.*.properties.*"
    then:
      field: "description"
      function: truthy

  # Naming conventions
  path-kebab-case:
    severity: warn
    description: "Path segments should use kebab-case"
    given: "$.paths.*~"
    then:
      function: pattern
      functionOptions:
        match: "^(/[a-z0-9]+(-[a-z0-9]+)*|/\\{[a-z0-9_]+\\})*$"

  # HTTP methods
  no-http-verbs-in-path:
    severity: error
    description: "HTTP verbs should not be used in paths"
    given: "$.paths.*~"
    then:
      function: pattern
      functionOptions:
        notMatch: ".*(create|read|update|delete|get|post|put|patch).*"